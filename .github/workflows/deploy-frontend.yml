name: Deploy Frontend

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/selise-frontend:latest
          build-args: |
            NEXT_PUBLIC_AUTH_URL=https://auth-services.redground-f9d124ef.centralindia.azurecontainerapps.io/api/auth
            NEXT_PUBLIC_SOCKET_URL=https://chat-services.redground-f9d124ef.centralindia.azurecontainerapps.io

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name frontend \
              --resource-group SeliseChat-India-RG \
              --image ${{ secrets.DOCKER_USERNAME }}/selise-frontend:latest
