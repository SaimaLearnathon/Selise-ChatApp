name: Deploy Chat Service

on:
  push:
    branches: [ "master" ]
    paths:
      - 'services/chat-services/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Chat Service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/chat-services
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/selise-chat:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Azure Container App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az containerapp update \
              --name chat-services \
              --resource-group SeliseChat-India-RG \
              --image ${{ secrets.DOCKER_USERNAME }}/selise-chat:latest
