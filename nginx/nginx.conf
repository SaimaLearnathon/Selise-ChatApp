events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

  resolver 168.63.129.16 valid=5s;

  server {
    listen 80;

    location /api/auth/ {
      limit_req zone=auth_limit burst=10 nodelay;
      set $auth_upstream http://auth-services.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_pass         $auth_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              auth-services.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      limit_req zone=api_limit burst=20 nodelay;
      set $chat_upstream http://chat-services.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_pass         $chat_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              chat-services.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/chat/ {
      limit_req zone=api_limit burst=20 nodelay;
      set $chat_upstream http://chat-services.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_pass         $chat_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              chat-services.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_set_header   X-Real-IP         $remote_addr;
    }

    location / {
      set $frontend_upstream http://frontend.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_pass         $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host              frontend.internal.redground-f9d124ef.centralindia.azurecontainerapps.io;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }
}